<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — iStealClips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#0a0a0f', 900: '#111118', 800: '#1a1a24', 700: '#25252f' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-dark-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-violet-400 tracking-tight">⚡ iStealClips</h1>
            <p class="text-xs text-gray-400">Log in or create a quick account to manage your clips</p>
        </div>

        {% if error %}
        <div class="bg-red-900/40 border border-red-500/50 text-red-300 text-xs p-3 rounded-xl text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">USERNAME</label>
                <input type="text" name="username" required placeholder="enter username"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">PASSWORD</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition">
            </div>

            <div class="flex items-center gap-2 text-xs text-gray-400">
                <input type="checkbox" name="action" value="register" id="reg-check" class="rounded bg-dark-800 border-gray-700 text-violet-600">
                <label for="reg-check">New account? Check box to Register</label>
            </div>

            <button type="submit"
                    class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                🔓 Log In / Register
            </button>
        </form>

        <div class="text-center">
            <p class="text-[11px] text-gray-500">First user login auto-creates admin account. Access from any device anytime!</p>
        </div>
    </div>
</body>
</html>
