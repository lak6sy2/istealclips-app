{% extends "base.html" %}
{% block title %}Buffer Accounts — iStealClips{% endblock %}
{% block content %}
<div class="space-y-6 max-w-3xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold">🔑 Connected Buffer Accounts</h1>
            <p class="text-xs text-gray-400 mt-1">Manage individual Buffer accounts with API Tokens, Client Keys & Schedule Links</p>
        </div>
        <button onclick="openAccountModal()" class="bg-violet-600 hover:bg-violet-700 text-xs sm:text-sm px-4 py-2 rounded-xl font-bold transition">
            + Add Buffer Account
        </button>
    </div>

    <!-- Profiles List -->
    <div id="accounts-grid" class="space-y-3"></div>
</div>

<!-- Modal Form -->
<div id="account-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-dark-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md space-y-4">
        <div class="flex justify-between items-center">
            <h2 id="acc-modal-title" class="text-lg font-bold text-violet-400">Add Buffer Account</h2>
            <button onclick="closeAccountModal()" class="text-gray-400 hover:text-white">✕</button>
        </div>

        <form id="accountForm" onsubmit="saveAccount(event)" class="space-y-3">
            <input type="hidden" id="originalAccId">

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">ACCOUNT NAME</label>
                <input type="text" id="accName" required placeholder="e.g. topkickhighlightz"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">BUFFER ACCESS TOKEN / API KEY</label>
                <input type="text" id="accToken" required placeholder="uRtNaixEpM7H82o..."
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">BUFFER PROFILE ID / CHANNEL ID</label>
                <input type="text" id="accProfileId" required placeholder="6a7d6f36b2d9d577436bb73d"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">CLIENT KEY / ORG ID (OPTIONAL)</label>
                <input type="text" id="accClientKey" placeholder="6a7d6d86bb615d4a32350f02"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">CLIENT SECRET KEY (OPTIONAL)</label>
                <input type="text" id="accClientSecret" placeholder="Secret Key"
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">SCHEDULE LINK (OPTIONAL)</label>
                <input type="url" id="accScheduleUrl" placeholder="https://publish.buffer.com/..."
                       class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeAccountModal()" class="bg-dark-800 text-gray-300 text-xs px-4 py-2 rounded-xl border border-gray-700">Cancel</button>
                <button type="submit" class="bg-violet-600 hover:bg-violet-700 text-white text-xs px-5 py-2 rounded-xl font-bold">Save Account</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let loadedAccountsList = [];

async function loadAccounts() {
    const res = await fetch('/api/accounts/profiles');
    const data = await res.json();
    const grid = document.getElementById('accounts-grid');

    loadedAccountsList = data.profiles || [];
    if (loadedAccountsList.length === 0) {
        grid.innerHTML = '<p class="text-xs text-gray-500 text-center py-8">No Buffer accounts added yet. Click "+ Add Buffer Account"</p>';
        return;
    }

    grid.innerHTML = loadedAccountsList.map(p => `
        <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="space-y-1">
                <div class="flex items-center gap-2">
                    <span class="text-base">📸</span>
                    <h3 class="text-sm font-bold text-violet-400">${p.name || 'Instagram Account'}</h3>
                    <span class="bg-violet-900/60 text-violet-300 text-[10px] px-2 py-0.5 rounded font-mono">${p.service || 'instagram'}</span>
                </div>
                <p class="text-[11px] text-gray-400 font-mono">Profile ID: ${p.profile_id}</p>
                ${p.access_token ? `<p class="text-[10px] text-gray-500 font-mono">Token: ${p.access_token.substring(0, 10)}...</p>` : ''}
                ${p.schedule_url ? `<a href="${p.schedule_url}" target="_blank" class="text-[11px] text-blue-400 hover:underline block truncate">🔗 Schedule Link</a>` : ''}
            </div>
            <div class="flex items-center gap-2 self-end sm:self-center">
                <button onclick="openEditAccountModal('${p.profile_id}')" class="bg-blue-900/40 hover:bg-blue-800/60 text-blue-300 text-xs px-3 py-1.5 rounded-xl font-medium transition">
                    ✏️ Edit
                </button>
                <button onclick="removeAccount('${p.profile_id}')" class="bg-red-900/40 hover:bg-red-800/60 text-red-300 text-xs px-3 py-1.5 rounded-xl font-medium transition">
                    🗑️ Remove
                </button>
            </div>
        </div>
    `).join('');
}

function openAccountModal() {
    document.getElementById('accountForm').reset();
    document.getElementById('originalAccId').value = '';
    document.getElementById('acc-modal-title').textContent = 'Add Buffer Account';
    document.getElementById('account-modal').classList.remove('hidden');
}

function openEditAccountModal(pid) {
    const p = loadedAccountsList.find(x => x.profile_id === pid || x.name === pid);
    if (!p) return;

    document.getElementById('accountForm').reset();
    document.getElementById('originalAccId').value = p.profile_id || p.name;
    document.getElementById('accName').value = p.name || '';
    document.getElementById('accToken').value = p.access_token || '';
    document.getElementById('accProfileId').value = p.profile_id || '';
    document.getElementById('accClientKey').value = p.client_id || '';
    document.getElementById('accClientSecret').value = p.client_secret || '';
    document.getElementById('accScheduleUrl').value = p.schedule_url || '';

    document.getElementById('acc-modal-title').textContent = `Edit Account: ${p.name}`;
    document.getElementById('account-modal').classList.remove('hidden');
}

function closeAccountModal() {
    document.getElementById('account-modal').classList.add('hidden');
}

async function saveAccount(e) {
    e.preventDefault();
    const origId = document.getElementById('originalAccId').value;
    const name = document.getElementById('accName').value.trim();
    const token = document.getElementById('accToken').value.trim();
    const pid = document.getElementById('accProfileId').value.trim();
    const clientKey = document.getElementById('accClientKey').value.trim();
    const clientSecret = document.getElementById('accClientSecret').value.trim();
    const scheduleUrl = document.getElementById('accScheduleUrl').value.trim() || pid;

    const payload = {
        name: name,
        access_token: token,
        profile_id: pid,
        schedule_url: scheduleUrl,
        client_id: clientKey,
        client_secret: clientSecret
    };

    let res;
    if (origId) {
        // Edit PUT
        res = await fetch(`/api/accounts/profiles/${origId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } else {
        // Add POST
        res = await fetch('/api/accounts/profiles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    if (res.ok) {
        showToast(origId ? 'Account updated! 🔑' : 'Account added! 🔑', 'success');
        closeAccountModal();
        loadAccounts();
    } else {
        showToast('Failed to save account', 'error');
    }
}

async function removeAccount(pid) {
    if (!confirm('Remove this connected account?')) return;
    await fetch(`/api/accounts/profiles/${pid}`, { method: 'DELETE' });
    loadAccounts();
    showToast('Account removed', 'info');
}

loadAccounts();
</script>
{% endblock %}
