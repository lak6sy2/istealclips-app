<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}iStealClips{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#0a0a0f', 900: '#111118', 800: '#1a1a24', 700: '#25252f' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 text-white min-h-screen">
    <!-- Nav -->
    <nav class="bg-dark-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-violet-400 tracking-tight flex items-center gap-1">⚡ iStealClips</a>
            
            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white p-2 text-xl focus:outline-none">
                ☰
            </button>

            <!-- Desktop Links -->
            <div class="hidden md:flex items-center gap-1 text-sm overflow-x-auto">
                <a href="/" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Upload</a>
                <a href="/edit" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Bulk Edit</a>
                <a href="/edited" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Edited</a>
                <a href="/analytics" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Analytics</a>
                <a href="/autoliker" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">❤️ Auto Liker</a>
                <a href="/presets" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Presets</a>
                <a href="/accounts" class="nav-link px-3 py-2 rounded-lg hover:bg-dark-700 transition">Accounts</a>
                <a href="/logout" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold ml-2 transition">Logout 🚪</a>
            </div>
        </div>

        <!-- Mobile Slide Down Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-dark-900 border-t border-gray-800 px-4 py-3 space-y-2 text-sm">
            <a href="/" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">📤 Upload</a>
            <a href="/edit" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">✂️ Bulk Edit</a>
            <a href="/edited" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">🖼️ Edited Gallery</a>
            <a href="/analytics" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">📈 Social Analytics</a>
            <a href="/autoliker" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">❤️ Auto Liker</a>
            <a href="/presets" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">🎨 Presets</a>
            <a href="/accounts" class="block px-3 py-2 rounded-lg hover:bg-dark-700 transition">🔑 Accounts</a>
            <a href="/logout" class="block px-3 py-2 rounded-lg bg-red-600/80 text-white font-semibold text-center">Logout 🚪</a>
        </div>
    </nav>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col gap-2 max-w-[90vw]"></div>

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
    <script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
