{% extends "base.html" %}
{% block title %}Edited Gallery — iStealClips{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h1 class="text-xl sm:text-2xl font-bold">🖼️ Edited Clips Gallery</h1>
        <div class="flex items-center gap-2">
            <button onclick="selectAll()" class="bg-dark-800 hover:bg-dark-700 text-xs px-3 py-1.5 rounded-lg border border-gray-700 transition">Select All</button>
            <button onclick="deselectAll()" class="bg-dark-800 hover:bg-dark-700 text-xs px-3 py-1.5 rounded-lg border border-gray-700 transition">Deselect All</button>
            <button onclick="goToPost()" class="bg-violet-600 hover:bg-violet-700 text-xs px-4 py-1.5 rounded-lg font-bold transition">📲 Post Selected →</button>
        </div>
    </div>

    <!-- Edited Clips Grid -->
    <div id="edited-clips-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadEditedClips() {
    const res = await fetch('/api/clips/edited');
    const data = await res.json();
    const grid = document.getElementById('edited-clips-grid');

    if (data.clips.length === 0) {
        grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full text-center py-12">No edited clips available yet. <a href="/edit" class="text-violet-400 underline">Edit some raw clips first</a></p>';
        return;
    }

    grid.innerHTML = data.clips.map(c => `
        <div class="bg-dark-800 rounded-xl overflow-hidden border border-gray-800 flex flex-col justify-between">
            <div>
                <div class="aspect-[9/16] bg-black relative group">
                    <video src="/api/clips/edited/${c.filename}/preview" controls muted preload="metadata" class="w-full h-full object-contain"></video>
                    <input type="checkbox" value="${c.clip_id}" class="edited-chk absolute top-2 left-2 w-4 h-4 rounded text-violet-600 focus:ring-0 z-10">
                    <span class="absolute bottom-2 right-2 bg-black/70 text-[10px] text-gray-300 px-2 py-0.5 rounded">🕒 ${formatTimeAgo(c.mtime)}</span>
                </div>
                <div class="p-3">
                    <p class="text-xs font-semibold text-gray-200 truncate">${c.filename}</p>
                    <div class="flex items-center justify-between text-[10px] text-gray-500 mt-1">
                        <span>${c.size_mb} MB</span>
                        <span class="text-violet-400 font-medium">${formatTimeAgo(c.mtime)}</span>
                    </div>
                </div>
            </div>
            <div class="p-3 pt-0 grid grid-cols-2 gap-2 text-xs">
                <a href="/api/clips/edited/${c.filename}/download" download class="bg-dark-700 hover:bg-dark-900 text-gray-300 py-1.5 rounded-lg text-center font-medium transition">⬇️ Download</a>
                <button onclick="deleteEditedClip('${c.clip_id}')" class="bg-red-900/40 hover:bg-red-800/60 text-red-300 py-1.5 rounded-lg font-medium transition">🗑️ Delete</button>
            </div>
        </div>
    `).join('');
}

function selectAll() {
    document.querySelectorAll('.edited-chk').forEach(c => c.checked = true);
}

function deselectAll() {
    document.querySelectorAll('.edited-chk').forEach(c => c.checked = false);
}

function goToPost() {
    const selected = Array.from(document.querySelectorAll('.edited-chk:checked')).map(c => c.value);
    if (selected.length === 0) {
        showToast('Please select at least one clip to post!', 'warning');
        return;
    }
    window.location.href = `/post?clips=${selected.join(',')}`;
}

async function deleteEditedClip(clipId) {
    await fetch(`/api/clips/edited/${clipId}`, { method: 'DELETE' });
    loadEditedClips();
    showToast('Clip deleted from gallery', 'info');
}

loadEditedClips();
</script>
{% endblock %}
